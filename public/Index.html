<!DOCTYPE html>  <html lang="pt-BR">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1">  
<title>Subway WASM Vault</title>  
<style>  
:root{--bg:#050505;--panel:#111;--line:#303030;--text:#f5f5f5;--muted:#999;--a:#d9ff35}  
*{box-sizing:border-box}  
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}  
header{height:75px;border-bottom:1px solid #292929;background:#050505;display:flex;align-items:center;padding:0 5%;gap:18px;position:sticky;top:0;z-index:3}  
.mark{font-size:28px;font-weight:900}  
.brand{font-size:21px;font-weight:900}  
.brand span{color:var(--a)}  
.search{margin-left:auto;width:min(350px,45vw);background:#181818;border:1px solid #333;border-radius:15px;padding:12px;color:white}  
main{width:min(1160px,92vw);margin:auto}  
.hero{text-align:center;padding:65px 0 40px}  
.eyebrow{font-size:11px;letter-spacing:4px;color:var(--a);font-weight:bold}  
h1{font-size:clamp(40px,7vw,76px);line-height:.95;letter-spacing:-3px}  
h1 span{color:var(--a)}  
.hero p{color:var(--muted);line-height:1.6}  
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:25px 0}  
.toolbar h2{margin-right:auto;font-size:19px}  
.filter{background:#151515;border:1px solid #333;color:white;padding:10px 15px;border-radius:30px}  
.filter.active{background:var(--a);color:black;font-weight:bold}  
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:45px}  
.card{background:linear-gradient(145deg,#191919,#0c0c0c);border:1px solid #303030;border-radius:17px;padding:13px;overflow:hidden}  
.card:hover{border-color:var(--a);transform:translateY(-3px)}  
.thumb{height:165px;background:#202020;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#888}  
.thumb img{width:100%;height:100%;object-fit:cover}  
.card h3{font-size:20px;margin:13px 2px 7px}  
.meta{font-size:12px;color:#999}  
.tag{color:var(--a);font-size:10px;letter-spacing:2px}  
.play{width:100%;padding:13px;margin-top:15px;background:var(--a);border:0;border-radius:9px;font-weight:900;cursor:pointer}  
.play:disabled{background:#292929;color:#888;cursor:not-allowed}  
.notice{border:1px solid #333;background:#101010;padding:18px;border-radius:14px;margin-bottom:45px;color:#aaa;font-size:13px}  
.notice b{color:var(--a)}  
.empty{grid-column:1/-1;text-align:center;padding:35px;color:#aaa}  
#modal{display:none;position:fixed;inset:0;background:#000e;z-index:10;padding:12px}  
#modal.open{display:flex;flex-direction:column}  
.modalhead{display:flex;justify-content:space-between;align-items:center;padding:12px}  
#player{flex:1;min-height:0;background:#000;border-radius:12px}  
#player iframe{width:100%;height:100%;border:0}  
.close{background:#222;color:white;border:1px solid #555;padding:10px 15px;border-radius:9px}  
footer{padding:25px 5%;border-top:1px solid #292929;color:#777;font-size:12px}  
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}  
@media(max-width:520px){.grid{grid-template-columns:1fr}.search{width:42vw}header{padding:0 15px}.brand{font-size:17px}}  
</style>  
</head>  
<body>  <header>  
<div class="mark">♛</div>  
<div class="brand">Subway <span>WASM</span> Vault</div>  
<input class="search" id="search" placeholder="Buscar mapas...">  
</header>  <main>  
<section class="hero">  
<div class="eyebrow">MAP DATABASE · WASM BUILDS</div>  
<h1>Subway Surfers<br><span>WASM VAULT</span></h1>  
<p>Explore os mapas e selecione sua build favorita.</p>  
</section>  <div class="toolbar">  
<h2 id="count">Carregando mapas...</h2>  
<button class="filter active" data-filter="all">Todos</button>  
<button class="filter" data-filter="playable">Jogáveis</button>  
<button class="filter" data-filter="other">Outros</button>  
</div>  <section class="grid" id="grid">  
<div class="empty">Carregando arquivos do GitHub...</div>  
</section>  <div class="notice">  
<b>SUBWAY WASM VAULT</b><br>  
Mapas e builds encontrados no repositório.  
</div>  
</main>  <footer>SUBWAY WASM VAULT / 2026</footer>  <div id="modal">  
<div class="modalhead">  
<strong id="modalTitle">Carregando mapa...</strong>  
<button class="close" id="close">FECHAR ✕</button>  
</div>  
<div id="player"></div>  
</div>  <script>  
const OWNER="laelexresenhexovodotita";  
const REPO="La-ele-";  
const BRANCH="main";  
  
const API=`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;  
const CDN=`https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${BRANCH}/`;  
  
const grid=document.getElementById("grid");  
const search=document.getElementById("search");  
  
let maps=[];  
let filter="all";  
  
const imageExt=/\.(png|jpg|jpeg|webp|avif|gif)$/i;  
const htmlExt=/\.html?$/i;  
  
function cleanName(s){  
return s.replace(/\.[^.]+$/,"")  
.replace(/[_-]+/g," ")  
.replace(/\b\w/g,c=>c.toUpperCase());  
}  
  
function norm(s){  
return s.toLowerCase().normalize("NFD")  
.replace(/[\u0300-\u036f]/g,"")  
.replace(/[^a-z0-9]+/g,"-")  
.replace(/^-|-$/g,"");  
}  
  
function getMapFolder(path){  
const parts=path.split("/");  
const i=parts.findIndex(p=>/^(maps|maps-shared)$/i.test(p));  
if(i<0||!parts[i+1])return null;  
return parts[i+1].includes(".")?null:parts[i+1];  
}  
  
function createMaps(files){  
const images=files.filter(f=>  
imageExt.test(f.path)&&  
/map-icons|maps|maps-shared/i.test(f.path)  
);  
  
const htmls=files.filter(f=>  
htmlExt.test(f.path)&&  
/imported-builds|downloads|maps|moggers/i.test(f.path)  
);  
  
const names=new Map();  
  
for(const file of files){  
const folder=getMapFolder(file.path);  
if(folder&&!names.has(norm(folder))){  
names.set(norm(folder),{  
name:cleanName(folder),  
folder,  
image:null,  
entry:null  
});  
}  
}  
  
for(const img of images){  
const base=img.path.split("/").pop().replace(imageExt,"");  
const key=norm(base);  
  
if(names.has(key)){  
names.get(key).image=img.path;  
}else{  
const match=[...names.values()].find(m=>  
norm(m.name)===key  
);  
if(match)match.image=img.path;  
}  
}  
  
for(const map of names.values()){  
const key=norm(map.name);  
  
const candidates=htmls.filter(f=>  
norm(f.path).includes(key)  
);  
  
if(candidates.length){  
candidates.sort((a,b)=>a.path.length-b.path.length);  
map.entry=candidates[0].path;  
}  
}  
  
return [...names.values()].sort((a,b)=>a.name.localeCompare(b.name));  
}  
  
function render(){  
const q=search.value.toLowerCase();  
  
const list=maps.filter(m=>{  
const matches=m.name.toLowerCase().includes(q);  
const type=filter==="all"||  
(filter==="playable"&&m.entry)||  
(filter==="other"&&!m.entry);  
return matches&&type;  
});  
  
document.getElementById("count").textContent=  
list.length+" mapas encontrados";  
  
if(!list.length){  
grid.innerHTML='<div class="empty">Nenhum mapa encontrado.</div>';  
return;  
}  
  
grid.innerHTML=list.map(m=>{  
const img=m.image?CDN+m.image:"";  
  
return `  
<article class="card">  
<div class="thumb">  
${img?  
`<img src="${img}" loading="lazy" alt="${m.name}" onerror="this.remove();this.parentElement.textContent='Imagem indisponível'">`  
:"Imagem não encontrada"}  
</div>  
<div class="tag">SUBWAY SURFERS MAP</div>  
<h3>${m.name}</h3>  
<div class="meta">${m.folder}</div>  
<button class="play" ${m.entry?"":"disabled"}  
data-map="${m.name}">  
${m.entry?"JOGAR MAPA":"BUILD NÃO DETECTADA"}  
</button>  
</article>`;  
}).join("");  
  
grid.querySelectorAll("[data-map]").forEach(btn=>{  
btn.addEventListener("click",()=>{  
const map=maps.find(m=>m.name===btn.dataset.map);  
if(map)launch(map);  
});  
});  
}  
  
function launch(map){  
if(!map.entry)return;  
  
document.getElementById("modalTitle").textContent=map.name;  
  
const player=document.getElementById("player");  
player.innerHTML="";  
  
const iframe=document.createElement("iframe");  
iframe.src=CDN+map.entry;  
iframe.allow="fullscreen; autoplay; gamepad";  
iframe.allowFullscreen=true;  
  
player.appendChild(iframe);  
document.getElementById("modal").classList.add("open");  
}  
  
document.getElementById("close").onclick=()=>{  
document.getElementById("modal").classList.remove("open");  
document.getElementById("player").innerHTML="";  
};  
  
search.oninput=render;  
  
document.querySelectorAll(".filter").forEach(btn=>{  
btn.onclick=()=>{  
document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));  
btn.classList.add("active");  
filter=btn.dataset.filter;  
render();  
};  
});  
  
async function load(){  
try{  
const response=await fetch(API);  
  
if(!response.ok)throw new Error("Erro ao acessar o GitHub: "+response.status);  
  
const data=await response.json();  
  
maps=createMaps(data.tree||[]);  
  
if(!maps.length){  
throw new Error("Nenhuma pasta de mapas reconhecida.");  
}  
  
render();  
  
}catch(error){  
grid.innerHTML=`  
<div class="empty">  
Não foi possível carregar os mapas.<br>  
${error.message}<br><br>  
Confira se o repositório está público e tente novamente.  
</div>`;  
document.getElementById("count").textContent="Erro ao carregar";  
}  
}  
  
load();  
</script>  </body>  
  </html>
